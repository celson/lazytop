[tools]
rust = "1.99.1"

[tasks.default]
description = "Lint, test and build lazytop"
alias = "all"
depends = ["lint", "test", "build"]

[tasks.build]
description = "Build the release binary"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/lazytop"]
run = "cargo build --release"

[tasks.run]
description = "Build and run lazytop"
raw = true
run = "cargo run --release --"

[tasks.demo]
description = "Run lazytop in demo mode"
raw = true
run = "cargo run --release -- --demo"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.lint]
description = "rustfmt check and clippy"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.install]
description = "Install lazytop to ~/.cargo/bin"
run = "cargo install --path ."

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.release]
description = "Tag v<Cargo.toml version> and push it to trigger the Release workflow"
run = """
set -eu
version=$(sed -n 's/^version = "\\(.*\\)"/\\1/p' Cargo.toml | head -1)
if [ -n "$(git status --porcelain)" ]; then echo "working tree not clean" >&2; exit 1; fi
if git rev-parse "v$version" >/dev/null 2>&1; then echo "tag v$version already exists; bump Cargo.toml version" >&2; exit 1; fi
cargo test --locked
git tag -a "v$version" -m "lazytop v$version"
git push origin "v$version"
echo "pushed v$version — see: gh run list --workflow release.yml"
"""
