name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, asset: darwin-amd64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=lazytop-${GITHUB_REF_NAME#v}-${{ matrix.asset }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/lazytop README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: lazytop-*.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum lazytop-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lazytop-*.tar.gz
            checksums.txt
          generate_release_notes: true
