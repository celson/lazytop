name: Release

# Tag push (v*) → verify, build 4 binaries, publish a GitHub Release.
# Manual run → verify and build only; archives are kept as workflow artifacts (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Resolve version
        id: version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$crate" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $crate"
              exit 1
            fi
            echo "version=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "version=$crate-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, asset: darwin-amd64 }
          # Ubuntu 22.04 keeps the glibc floor low enough for Debian 12 / Ubuntu 22.04 users.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: |
          bin=target/${{ matrix.target }}/release/lazytop
          "$bin" --version
          "$bin" --demo --dump 120x40 > /dev/null
      - name: Package
        run: |
          name=lazytop-${{ needs.verify.outputs.version }}-${{ matrix.asset }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/lazytop README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: lazytop-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum lazytop-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            lazytop-*.tar.gz
            checksums.txt
          generate_release_notes: true
